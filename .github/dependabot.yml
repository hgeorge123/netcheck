version: 2
updates:
  - package-ecosystem: gomod
    commit-message:
      prefix: deps
    directory: /
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
  - package-ecosystem: npm
    commit-message:
      prefix: deps
    directory: /web
    schedule:
      interval: weekly
    groups:
      cloudscape:
        patterns: ["@cloudscape-design/*"]
  - package-ecosystem: docker
    commit-message:
      prefix: deps
    directories: [/, /probe-image]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    commit-message:
      prefix: ci
    directory: /
    schedule:
      interval: weekly
