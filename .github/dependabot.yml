version: 2
updates:
  - package-ecosystem: gomod
    commit-message:
      prefix: deps
    directory: /
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
  - package-ecosystem: npm
    commit-message:
      prefix: deps
    directory: /web
    schedule:
      interval: weekly
    groups:
      cloudscape:
        patterns: ["@cloudscape-design/*"]
      # Packages that only install together: each one requires the same major version of the others.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "vitest", "@vitest/*", "@vitejs/*"]
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint"]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only. Remove this once it supports newer versions.
      - dependency-name: typescript
        versions: [">=6.1.0"]
  - package-ecosystem: docker
    commit-message:
      prefix: deps
    directories: [/, /probe-image]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    commit-message:
      prefix: ci
    directory: /
    schedule:
      interval: weekly
