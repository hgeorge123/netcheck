name: pr-title

# Pull requests are squash-merged and their title becomes the commit message,
# which release-please reads to pick the next version and write the changelog.
# The title must follow Conventional Commits, e.g. "feat: add UDP checks".
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            deps
            chore
            refactor
            test
            build
            ci
          requireScope: false
