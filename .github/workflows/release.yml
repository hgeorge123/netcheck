name: release

# Push a tag like v0.2.0 (it must match appVersion in chart/netcheck/Chart.yaml).
# Images go to GHCR and, when the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# repository secrets are set, also to Docker Hub (same build, same digests).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      probe_digest: ${{ steps.probe.outputs.digest }}
      app_repo: ${{ steps.meta.outputs.app_repo }}
      probe_repo: ${{ steps.meta.outputs.probe_repo }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Check the tag against the chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          app_version="$(awk -F'"' '/^appVersion:/ {print $2}' chart/netcheck/Chart.yaml)"
          chart_version="$(awk '/^version:/ {print $2}' chart/netcheck/Chart.yaml)"
          if [ "$version" != "$app_version" ] || [ "$version" != "$chart_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Chart.yaml (version $chart_version, appVersion $app_version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # The published chart points to Docker Hub when it is configured,
          # otherwise to GHCR. "latest" is a convenience for docker pull; the
          # chart always uses the digests.
          app_repo="${REGISTRY}/netcheck"
          probe_repo="${REGISTRY}/netcheck-probe"
          app="${app_repo}:${version},${app_repo}:latest"
          probe="${probe_repo}:${version},${probe_repo}:latest"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            app_repo="docker.io/${DOCKERHUB_USERNAME}/netcheck"
            probe_repo="docker.io/${DOCKERHUB_USERNAME}/netcheck-probe"
            app="${app},${app_repo}:${version},${app_repo}:latest"
            probe="${probe},${probe_repo}:${version},${probe_repo}:latest"
          fi
          echo "app_repo=${app_repo}" >> "$GITHUB_OUTPUT"
          echo "probe_repo=${probe_repo}" >> "$GITHUB_OUTPUT"
          echo "app_tags=${app}" >> "$GITHUB_OUTPUT"
          echo "probe_tags=${probe}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: app
        name: Build and push the NetCheck image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.app_tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - id: probe
        name: Build and push the probe image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: probe-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.probe_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

  chart:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Pin the release images in the chart
        env:
          APP_REPO: ${{ needs.images.outputs.app_repo }}
          APP_DIGEST: ${{ needs.images.outputs.app_digest }}
          PROBE_REPO: ${{ needs.images.outputs.probe_repo }}
          PROBE_DIGEST: ${{ needs.images.outputs.probe_digest }}
        run: |
          case "${APP_DIGEST}${PROBE_DIGEST}" in
            sha256:*sha256:*) ;;
            *) echo "missing image digests" >&2; exit 1 ;;
          esac
          yq -i '.image.repository = strenv(APP_REPO) | .image.digest = strenv(APP_DIGEST) |
            .probeImage.repository = strenv(PROBE_REPO) | .probeImage.digest = strenv(PROBE_DIGEST)' chart/netcheck/values.yaml
          yq '{"image": .image, "probeImage": .probeImage}' chart/netcheck/values.yaml
      - name: Package and push the chart (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package chart/netcheck --destination dist
          helm push "dist/netcheck-${{ needs.images.outputs.version }}.tgz" "oci://${REGISTRY}/charts"

  release:
    needs: [images, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.images.outputs.version }}
          APP_DIGEST: ${{ needs.images.outputs.app_digest }}
          PROBE_DIGEST: ${{ needs.images.outputs.probe_digest }}
        run: |
          {
            echo "## Images"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`${REGISTRY}/netcheck:${VERSION}\` | \`${APP_DIGEST}\` |"
            echo "| \`${REGISTRY}/netcheck-probe:${VERSION}\` | \`${PROBE_DIGEST}\` |"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              echo "| \`docker.io/${DOCKERHUB_USERNAME}/netcheck:${VERSION}\` | \`${APP_DIGEST}\` |"
              echo "| \`docker.io/${DOCKERHUB_USERNAME}/netcheck-probe:${VERSION}\` | \`${PROBE_DIGEST}\` |"
            fi
          } > notes.md
          cat >> notes.md <<EOF

          ## Install

          \`\`\`bash
          helm upgrade --install netcheck oci://${REGISTRY}/charts/netcheck --version ${VERSION} \\
            --namespace netcheck -f my-values.yaml
          \`\`\`

          The chart already points to these images by digest; no image values are needed.

          See [docs/install.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/docs/install.md)
          and the changes in [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md).
          EOF
          gh release create "$GITHUB_REF_NAME" --title "NetCheck ${VERSION}" --notes-file notes.md
