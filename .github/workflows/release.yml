name: release

# Releases are prepared in the release pull request and published when it is
# merged, so the git tag, main and the published chart carry the same pinned
# images:
#
# 1. On every push to main, release-please keeps the release pull request up to
#    date (next version in Chart.yaml, version.txt and the docs; CHANGELOG.md).
# 2. "prepare" brings that branch up to date with main, builds both images with
#    the new version, pushes them to GHCR by digest only (no tags yet), attests
#    their provenance and commits repository, tag and digest to values.yaml in
#    the pull request.
# 3. Merging the pull request tags the release. "publish" checks that the tag is
#    exactly what was built, copies the same images (same digests) to their
#    release tags on GHCR and Docker Hub and signs them; "chart", "dockerhub"
#    and "notes" publish the rest.
#
# Docker Hub is used when the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are
# set; release tags are immutable there, so "latest" is only published on GHCR.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  RELEASE_BRANCH: release-please--branches--main--components--netcheck

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # With GITHUB_TOKEN, GitHub does not run CI on the release pull
          # request. A fine-grained token or GitHub App token in
          # RELEASE_PLEASE_TOKEN (contents and pull requests: write) avoids it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare:
    needs: release-please
    if: needs.release-please.outputs.created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the pinned images to the release branch
      pull-requests: read
      statuses: write # the release/images check on the release pull request
      packages: write
      id-token: write # build provenance
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: pr
        name: Find the open release pull request
        run: |
          number="$(gh pr list --head "${RELEASE_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          [ -n "${number}" ] && echo "release pull request #${number}" || echo "no open release pull request"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.pr.outputs.number != ''
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0
          # Pushes made with GITHUB_TOKEN do not start CI on the pull request.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - id: state
        name: Bring the release branch up to date with main
        if: steps.pr.outputs.number != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pr_head="$(git rev-parse HEAD)"
          echo "pr_head=${pr_head}" >> "$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit -m "chore: merge main into the release branch" origin/main
          fi
          version="$(tr -d '[:space:]' < version.txt)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Nothing to do when the last commit already pins this version.
          if [ "$(git log -1 --format=%s)" = "chore: pin the ${version} images in the chart values" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "the release branch already pins the ${version} images"
            bash .github/scripts/release-status.sh "${pr_head}" success "The ${version} images are built and pinned"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            bash .github/scripts/release-status.sh "${pr_head}" pending "Building and pinning the ${version} images; do not merge yet"
          fi

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: steps.state.outputs.build == 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.state.outputs.build == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.state.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: app
        name: Build the NetCheck image (pushed by digest)
        if: steps.state.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/netcheck,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.state.outputs.version }}
            COMMIT=${{ steps.state.outputs.commit }}
            BUILD_DATE=${{ steps.state.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.state.outputs.commit }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.state.outputs.version }}

      - id: probe
        name: Build the probe image (pushed by digest)
        if: steps.state.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: probe-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/netcheck-probe,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.state.outputs.commit }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.state.outputs.version }}

      - name: Attest the NetCheck image provenance
        if: steps.state.outputs.build == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/netcheck
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true
      - name: Attest the probe image provenance
        if: steps.state.outputs.build == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/netcheck-probe
          subject-digest: ${{ steps.probe.outputs.digest }}
          push-to-registry: true

      # Before pinning: a release with fixable High or Critical
      # vulnerabilities fails here and release/images turns red.
      - name: Scan the images for vulnerabilities
        if: steps.state.outputs.build == 'true'
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/netcheck@${{ steps.app.outputs.digest }}
          PROBE_IMAGE: ${{ env.REGISTRY }}/netcheck-probe@${{ steps.probe.outputs.digest }}
        run: bash .github/scripts/scan-images.sh "${APP_IMAGE}" "${PROBE_IMAGE}"

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        if: steps.state.outputs.build == 'true'
      - name: Pin the images in the release pull request
        if: steps.state.outputs.build == 'true'
        env:
          VERSION: ${{ steps.state.outputs.version }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          PROBE_DIGEST: ${{ steps.probe.outputs.digest }}
        run: |
          . .github/scripts/image-repos.sh
          bash .github/scripts/pin-images.sh "${VERSION}" "${APP_REPO}" "${APP_DIGEST}" "${PROBE_REPO}" "${PROBE_DIGEST}"
          git commit -am "chore: pin the ${VERSION} images in the chart values"
          if [ "$(gh pr view "${PR_NUMBER}" --json state --jq .state)" != "OPEN" ]; then
            echo "::error::the release pull request was merged or closed before its images were pinned"
            exit 1
          fi
          # If release-please rewrote the branch meanwhile, the next run pins it.
          if git push origin "HEAD:${RELEASE_BRANCH}"; then
            bash .github/scripts/release-status.sh "$(git rev-parse HEAD)" success "The ${VERSION} images are built and pinned"
          else
            echo "::warning::the release branch changed; the next run will pin it"
          fi

      - name: Report a failure on the release pull request
        if: failure() && steps.state.outputs.pr_head != ''
        run: |
          bash .github/scripts/release-status.sh "${{ steps.state.outputs.pr_head }}" failure "The release images could not be prepared; see the workflow run"

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    outputs:
      app_digest: ${{ steps.check.outputs.app_digest }}
      probe_digest: ${{ steps.check.outputs.probe_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - id: check
        name: Check that the tag is exactly what was built
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          . .github/scripts/image-repos.sh
          values=chart/netcheck/values.yaml
          fail() { echo "::error::$*"; exit 1; }
          [ "$(yq '.version' chart/netcheck/Chart.yaml)" = "${VERSION}" ] || fail "Chart.yaml version is not ${VERSION}"
          [ "$(yq '.appVersion' chart/netcheck/Chart.yaml)" = "${VERSION}" ] || fail "Chart.yaml appVersion is not ${VERSION}"
          [ "$(yq '.image.repository' "$values")" = "${APP_REPO}" ] || fail "image.repository is not ${APP_REPO}"
          [ "$(yq '.probeImage.repository' "$values")" = "${PROBE_REPO}" ] || fail "probeImage.repository is not ${PROBE_REPO}"
          [ "$(yq '.image.tag' "$values")" = "${VERSION}" ] || fail "image.tag is not ${VERSION}: the images were not prepared for this release"
          [ "$(yq '.probeImage.tag' "$values")" = "${VERSION}" ] || fail "probeImage.tag is not ${VERSION}"
          # The commit that pinned the images must be the content of the tag:
          # nothing may change between the build and the release.
          pinned="$(git log -1 --format=%H -- "$values")"
          [ "$(git log -1 --format=%s "$pinned")" = "chore: pin the ${VERSION} images in the chart values" ] \
            || fail "values.yaml was changed after the images were pinned"
          git diff --quiet "$pinned" HEAD || fail "files changed after the images were built: $(git diff --name-only "$pinned" HEAD | tr '\n' ' ')"
          echo "app_digest=$(yq '.image.digest' "$values")" >> "$GITHUB_OUTPUT"
          echo "probe_digest=$(yq '.probeImage.digest' "$values")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the prepared images (same digests, no rebuild)
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          APP_DIGEST: ${{ steps.check.outputs.app_digest }}
          PROBE_DIGEST: ${{ steps.check.outputs.probe_digest }}
        run: |
          . .github/scripts/image-repos.sh
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          promote() {
            local name="$1" digest="$2" dst got
            shift 2
            for dst in "$@"; do
              skopeo copy --all --preserve-digests "docker://${REGISTRY}/${name}@${digest}" "docker://${dst}"
              got="sha256:$(skopeo inspect --raw "docker://${dst}" | sha256sum | cut -d' ' -f1)"
              [ "$got" = "$digest" ] || { echo "::error::${dst} has digest ${got}, expected ${digest}"; exit 1; }
            done
          }
          targets() { for r in $1; do echo "${r}:${VERSION}"; case "$r" in ghcr.io/*) echo "${r}:latest" ;; esac; done; }
          promote netcheck "${APP_DIGEST}" $(targets "${APP_REPOS}")
          promote netcheck-probe "${PROBE_DIGEST}" $(targets "${PROBE_REPOS}")

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the images (keyless, Sigstore)
        env:
          APP_DIGEST: ${{ steps.check.outputs.app_digest }}
          PROBE_DIGEST: ${{ steps.check.outputs.probe_digest }}
        run: |
          . .github/scripts/image-repos.sh
          for r in ${APP_REPOS}; do cosign sign --yes "${r}@${APP_DIGEST}"; done
          for r in ${PROBE_REPOS}; do cosign sign --yes "${r}@${PROBE_DIGEST}"; done

  chart:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Check the pinned images in the chart
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          APP_DIGEST: ${{ needs.publish.outputs.app_digest }}
          PROBE_DIGEST: ${{ needs.publish.outputs.probe_digest }}
        run: |
          . .github/scripts/image-repos.sh
          bash .github/scripts/pin-images.sh "${VERSION}" "${APP_REPO}" "${APP_DIGEST}" "${PROBE_REPO}" "${PROBE_DIGEST}"
          git diff --exit-code chart/netcheck/values.yaml

      - id: push
        name: Package and push the chart (OCI)
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm lint chart/netcheck
          helm package chart/netcheck --destination dist
          helm push "dist/netcheck-${VERSION}.tgz" "oci://${REGISTRY}/charts" 2>&1 | tee push.log
          digest="$(awk '/^Digest:/ {print $2}' push.log)"
          case "$digest" in sha256:*) ;; *) echo "could not read the chart digest" >&2; exit 1 ;; esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the chart (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GH_TOKEN}" | cosign login ghcr.io --username "${{ github.actor }}" --password-stdin
          cosign sign --yes "${REGISTRY}/charts/netcheck@${DIGEST}"

  dockerhub:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.DOCKERHUB_USERNAME != ''
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      # Needs a Docker Hub token with "Read, Write, Delete" access: Docker Hub
      # does not allow changing repository descriptions with less.
      - name: Update the netcheck description on Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/netcheck
          short-description: Network connectivity diagnostics from Kubernetes namespaces (API, web UI, controller)
          readme-filepath: docs/dockerhub/netcheck.md
      - name: Update the netcheck-probe description on Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/netcheck-probe
          short-description: NetCheck probe, a shell-less Go binary for DNS, TCP, HTTP(S), ping and traceroute
          readme-filepath: docs/dockerhub/netcheck-probe.md

  notes:
    needs: [release-please, publish, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Add the images and the chart to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          APP_DIGEST: ${{ needs.publish.outputs.app_digest }}
          PROBE_DIGEST: ${{ needs.publish.outputs.probe_digest }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          . .github/scripts/image-repos.sh
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "helm upgrade --install netcheck oci://${REGISTRY}/charts/netcheck --version ${VERSION} \\"
            echo "  --namespace netcheck -f values.yaml"
            echo '```'
            echo
            echo "The chart, the \`${TAG}\` tag and \`main\` at this release pin the images below by digest;"
            echo "no image values are needed. See the [installation guide](https://github.com/${GH_REPO}/blob/${TAG}/docs/install.md)."
            echo
            echo "## Artifacts"
            echo
            echo "| Artifact | Digest |"
            echo "|---|---|"
            echo "| \`oci://${REGISTRY}/charts/netcheck:${VERSION}\` | \`${CHART_DIGEST}\` |"
            for r in ${APP_REPOS}; do echo "| \`${r}:${VERSION}\` | \`${APP_DIGEST}\` |"; done
            for r in ${PROBE_REPOS}; do echo "| \`${r}:${VERSION}\` | \`${PROBE_DIGEST}\` |"; done
            echo
            echo "Images and chart are signed with Sigstore (keyless) and the images carry SBOM and build provenance."
            echo "See [verifying releases](https://github.com/${GH_REPO}/blob/${TAG}/docs/security.md#10-verifying-releases)."
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md

  # If a release could not be published (for example, its pull request was
  # merged before the images were pinned), say so on the release and mark it
  # as a pre-release so it is never shown as the latest version.
  not-published:
    needs: [release-please, publish, chart]
    if: always() && needs.release-please.outputs.created == 'true' && (needs.publish.result != 'success' || needs.chart.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark the release as not published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          {
            echo "> [!WARNING]"
            echo "> This release was **not published**: no images or chart exist for it. Install a later version."
            echo "> See the [workflow run](${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID})."
            echo
            gh release view "$TAG" --json body --jq .body
          } > notes.md
          gh release edit "$TAG" --prerelease --notes-file notes.md
