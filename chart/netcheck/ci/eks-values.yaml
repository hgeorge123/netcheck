# Render-only values used by chart/check.sh (dummy account, digests and CIDRs).
environment: production
clusterId: ci-eks
image:
  repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/netcheck
  digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  tag: ""
probeImage:
  repository: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/netcheck-probe
  digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
  tag: ""
auth:
  trustedProxyCidrs: [10.0.0.0/16]
namespaceScope:
  mode: all
  exclude: [amazon-cloudwatch]
destinations:
  allowCidrs: [10.0.0.0/16, 172.20.0.0/16]
  allowHostnameSuffixes: [.svc.cluster.local]
  allowPorts:
    - {from: 80, to: 80}
    - {from: 443, to: 443}
httpRoute:
  enabled: true
  hostnames: [netcheck.example.com]
  parentRefs:
    - name: shared-gateway
      namespace: nginx-gateway
      sectionName: https