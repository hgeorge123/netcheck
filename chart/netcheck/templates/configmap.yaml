{{- include "netcheck.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "netcheck.fullname" . }}-config
  namespace: {{ include "netcheck.namespace" . }}
  labels:
    {{- include "netcheck.labels" . | nindent 4 }}
data:
  config.yaml: |
    environment: {{ .Values.environment }}
    clusterId: {{ .Values.clusterId | quote }}
    logLevel: {{ .Values.logLevel | quote }}
    listen: ":8080"
    webDir: /app/web
    database:
      path: /data/netcheck.db
      wal: {{ .Values.persistence.wal }}
    auth:
      sessionIdleMinutes: {{ .Values.auth.sessionIdleMinutes }}
      sessionMaxHours: {{ .Values.auth.sessionMaxHours }}
      maxFailedLogins: {{ .Values.auth.maxFailedLogins }}
      lockoutMinutes: {{ .Values.auth.lockoutMinutes }}
      loginAttemptsPerIpPerMinute: {{ .Values.auth.loginAttemptsPerIpPerMinute }}
      cookieSecure: {{ .Values.auth.cookieSecure }}
      trustedProxyCidrs:
        {{- toYaml .Values.auth.trustedProxyCidrs | nindent 8 }}
      bootstrapAdmin:
        username: {{ .Values.auth.bootstrapAdmin.username | quote }}
        forcePasswordChange: {{ .Values.auth.bootstrapAdmin.forcePasswordChange }}
      {{- with .Values.auth.oidc }}
      oidc:
        enabled: {{ .enabled }}
        {{- if .enabled }}
        providerName: {{ .providerName | quote }}
        issuerUrl: {{ include "netcheck.oidcIssuer" $ | quote }}
        {{- if $.Values.dex.enabled }}
        # NetCheck reaches the bundled Dex inside the cluster for tokens and keys.
        internalUrl: {{ printf "http://%s.%s.svc:5556/dex" (include "netcheck.dexName" $) (include "netcheck.namespace" $) | quote }}
        {{- end }}
        clientId: {{ .clientId | quote }}
        redirectUrl: {{ include "netcheck.oidcRedirectUrl" $ | quote }}
        scopes: {{ toJson .scopes }}
        usernameClaim: {{ .usernameClaim | quote }}
        groupsClaim: {{ .groupsClaim | quote }}
        {{- end }}
      {{- end }}
    namespaceScope:
      {{- toYaml .Values.namespaceScope | nindent 6 }}
    destinations:
      {{- toYaml .Values.destinations | nindent 6 }}
    protectPlatformDestinations: {{ .Values.protectPlatformDestinations }}
    destinationsManagedBy: {{ .Values.destinationsManagedBy | quote }}
    trustedCasManagedBy: {{ .Values.trustedCasManagedBy | quote }}
    trustedCas:
      {{- toYaml .Values.trustedCas | nindent 6 }}
    proxiesManagedBy: {{ .Values.proxiesManagedBy | quote }}
    proxies:
      {{- toYaml .Values.proxies | nindent 6 }}
    kubeApiServerCidrs:
      {{- toYaml .Values.kubeApiServerCidrs | nindent 6 }}
    # Denied only until the exact API server addresses are read from the
    # EndpointSlice default/kubernetes (or for good if they cannot be read).
    kubeApiServerFallbackCidrs:
      {{- toYaml .Values.networkPolicy.apiServer.cidrs | nindent 6 }}
    limits:
      {{- toYaml .Values.limits | nindent 6 }}
    probe:
      image: {{ include "netcheck.probeImage" . | quote }}
      {{- toYaml .Values.probe | nindent 6 }}
    retention:
      {{- toYaml .Values.retention | nindent 6 }}
    networkPolicyRead: {{ .Values.networkPolicyRead }}
