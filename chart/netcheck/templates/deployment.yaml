apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netcheck.fullname" . }}
  namespace: {{ include "netcheck.namespace" . }}
  labels:
    {{- include "netcheck.labels" . | nindent 4 }}
spec:
  # SQLite on an EBS (RWO) volume: exactly one writer, no rolling overlap.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "netcheck.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "netcheck.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "netcheck.serviceAccountName" . }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netcheck
          image: {{ include "netcheck.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/netcheck/config.yaml"]
          env:
            - name: NETCHECK_ENV
              value: {{ .Values.environment | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Shown to administrators in System → Versions.
            - name: NETCHECK_IMAGE
              value: {{ include "netcheck.image" . | quote }}
            - name: NETCHECK_CHART_VERSION
              value: {{ .Chart.Version | quote }}
            - name: NETCHECK_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "netcheck.bootstrapSecretName" . }}
                  key: {{ .Values.auth.bootstrapAdmin.secretKey }}
            {{- if .Values.auth.bootstrapAdmin.recoverOnStart }}
            # Break-glass admin recovery (see the admin manual). Turn it off
            # again right after logging in.
            - name: NETCHECK_RECOVER_BOOTSTRAP_ADMIN
              value: "true"
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/netcheck
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "netcheck.fullname" . }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "netcheck.fullname" .)) }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
