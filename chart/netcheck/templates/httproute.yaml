{{- if .Values.httpRoute.enabled }}
# Attaches NetCheck to an existing Gateway (e.g. NGINX Gateway Fabric). The
# Gateway, its TLS certificate and allowedRoutes are managed outside this chart.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "netcheck.fullname" . }}
  namespace: {{ include "netcheck.namespace" . }}
  labels:
    {{- include "netcheck.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.httpRoute.parentRefs }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .name }}
      namespace: {{ .namespace | default (include "netcheck.namespace" $) }}
      sectionName: {{ .sectionName }}
    {{- end }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "netcheck.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
