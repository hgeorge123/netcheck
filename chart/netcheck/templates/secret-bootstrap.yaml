{{- if not .Values.auth.bootstrapAdmin.existingSecret }}
# Initial admin password (auth.bootstrapAdmin.password). It is only used to
# create the first administrator, who must change it at the first sign-in,
# and by the break-glass recovery procedure.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netcheck.bootstrapSecretName" . }}
  namespace: {{ include "netcheck.namespace" . }}
  labels:
    {{- include "netcheck.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.auth.bootstrapAdmin.secretKey }}: {{ .Values.auth.bootstrapAdmin.password | b64enc }}
{{- end }}
