{{- if not .Values.auth.bootstrapAdmin.existingSecret }}
{{- $name := include "netcheck.bootstrapSecretName" . }}
{{- $namespace := include "netcheck.namespace" . }}
{{- $key := .Values.auth.bootstrapAdmin.secretKey }}
{{- /* An existing Secret is never changed: upgrades keep its value. */}}
{{- $value := dig "data" $key "" (lookup "v1" "Secret" $namespace $name) }}
{{- if not $value }}
{{- $value = .Values.auth.bootstrapAdmin.password | default (randAlphaNum 24) | b64enc }}
{{- end }}
# Initial admin password. Generated on the first install (or taken from
# auth.bootstrapAdmin.password) and kept on upgrades and uninstalls. It is only
# used to create the first administrator, who must change it at the first
# sign-in, and by the break-glass recovery procedure.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "netcheck.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value }}
{{- end }}
