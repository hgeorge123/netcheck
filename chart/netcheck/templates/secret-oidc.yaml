{{- if and .Values.auth.oidc.enabled (not .Values.auth.oidc.existingSecret) }}
{{- $name := include "netcheck.oidcSecretName" . }}
{{- $namespace := include "netcheck.namespace" . }}
{{- $key := .Values.auth.oidc.secretKey }}
{{- /* Like the bootstrap admin Secret: created once, never changed by upgrades. */}}
{{- $value := dig "data" $key "" (lookup "v1" "Secret" $namespace $name) }}
{{- if not $value }}
{{- $value = .Values.auth.oidc.clientSecret | default (randAlphaNum 40) | b64enc }}
{{- end }}
# Client secret shared by NetCheck and the identity provider: the value
# given by the provider, or a random one for the bundled Dex.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "netcheck.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value }}
{{- end }}
