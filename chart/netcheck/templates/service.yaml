apiVersion: v1
kind: Service
metadata:
  name: {{ include "netcheck.fullname" . }}
  namespace: {{ include "netcheck.namespace" . }}
  labels:
    {{- include "netcheck.labels" . | nindent 4 }}
spec:
  # Internal only: users reach NetCheck through the HTTPRoute on your Gateway.
  type: ClusterIP
  selector:
    {{- include "netcheck.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
