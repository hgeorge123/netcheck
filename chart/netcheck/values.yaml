# NetCheck Helm values. Every value marked REQUIRED must be set; the chart
# refuses to render otherwise. See docs/install.md and docs/admin-guide.md.

# -- production | development. Development only relaxes cookie/bootstrap
# settings for local laboratories and must never be used in a real cluster.
environment: production
# -- Free text shown in the UI and stored with every run (e.g. the EKS cluster name).
clusterId: eks
# -- Minimum level written to the Pod log: debug, info, warn or error. info logs
# every HTTP request and test; warn keeps only problems; debug adds internal
# retries (troubleshooting only).
logLevel: info

namespace:
  # -- Create the namespace where NetCheck runs (true) or use an existing one
  # (false, default). With create=true, install the release metadata in another
  # existing namespace: helm install netcheck chart/netcheck -n default --set namespace.create=true
  create: false
  # -- Namespace where NetCheck runs. Empty = the Helm release namespace (-n).
  name: ""
  # -- Labels for the created namespace (only with create=true).
  labels:
    pod-security.kubernetes.io/enforce: restricted

# Images are always deployed by digest. The release workflow pins the images
# of each release here in the release pull request, so the release tag, main
# and the published chart install exactly the images built for that version. The same
# images (same digests) are on ghcr.io/hgeorge123 too. Override only to use a
# mirror (e.g. ECR) or images you built yourself.
image:
  # -- NetCheck image (API, web UI and controller).
  repository: docker.io/hgeorge123/netcheck
  # -- Release version of the image, set by the release workflow. With a
  # digest it is only informative (repo:tag@digest); without one it is used
  # alone, which is only accepted in development.
  tag: "1.2.0"
  # -- REQUIRED in production: image digest (sha256:...), set by the release
  # workflow. Tags can be moved; the digest cannot.
  digest: "sha256:44d61b0864a819ceb1f50ee4c9052a1f19fc115bb99d1b9dd50e12f31e904e27"
  pullPolicy: IfNotPresent

probeImage:
  # -- Probe image (runs in the source namespaces).
  repository: docker.io/hgeorge123/netcheck-probe
  # -- Release version of the image (informative), set by the release workflow.
  tag: "1.2.0"
  # -- REQUIRED. sha256 digest, set by the release workflow. The admission
  # policy pins this exact reference.
  digest: "sha256:5427f5784321fa7aeb312fad586a4b6302d40cd3f0290208eefafa88623b2b33"

# -- Only needed for private registries. The published images are public; EKS
# nodes pull from same-account ECR with the node IAM role.
imagePullSecrets: []

auth:
  sessionIdleMinutes: 60
  sessionMaxHours: 12
  maxFailedLogins: 5
  lockoutMinutes: 15
  loginAttemptsPerIpPerMinute: 20
  # -- Keep true: TLS terminates at the Gateway, the browser always uses HTTPS.
  cookieSecure: true
  # -- CIDRs of the Gateway data plane Pods. X-Forwarded-For is honoured only
  # from these addresses (per-IP login throttling). Usually the VPC CIDR.
  trustedProxyCidrs: []
  bootstrapAdmin:
    # -- Initial administrator, created only when no admin exists.
    username: admin
    # -- Must stay true outside development.
    forcePasswordChange: true
    # -- Initial password. Empty (default): a random one is generated on the
    # first install. Either way it only applies when the Secret is created:
    # upgrades never change an existing Secret. The admin must change it at
    # the first sign-in.
    password: ""
    # -- Existing Secret holding the initial password (overrides password).
    existingSecret: ""
    secretKey: password
    # -- Break-glass: on start, reset this admin to the Secret password
    # (enabled, unlocked, must change it). Set back to false right after.
    recoverOnStart: false
  # Single sign-on with OpenID Connect, next to the local accounts. People
  # who sign in with it get their role and namespaces from the access rules
  # (Administration > Access rules), defined before they sign in. For GitHub,
  # LDAP or SAML, enable the bundled Dex (dex.enabled) like Argo CD does.
  oidc:
    enabled: false
    # -- Label of the sign-in button ("Sign in with <providerName>").
    providerName: SSO
    # -- Issuer of the provider, e.g. https://login.microsoftonline.com/<tenant>/v2.0.
    # Empty with dex.enabled: https://<first host>/dex.
    issuerUrl: ""
    clientId: netcheck
    # -- Secret with the client secret (key secretKey). Empty: the chart
    # creates one from clientSecret, or a random value for the bundled Dex,
    # on the first install only (upgrades keep it).
    existingSecret: ""
    secretKey: client-secret
    # -- Client secret given by the provider. Prefer existingSecret.
    clientSecret: ""
    # -- Empty: https://<first host>/api/v1/auth/oidc/callback. Register it
    # as the redirect URI of the client at the provider.
    redirectUrl: ""
    scopes: [openid, profile, email, groups]
    # -- Claim used as the NetCheck username: email, preferred_username, sub or name.
    usernameClaim: email
    # -- Claim with the groups used by the access rules.
    groupsClaim: groups

namespaceScope:
  # -- all: every namespace (including future ones) except system/excluded;
  #    needs a ClusterRole (see docs/security.md).
  #    list: only the namespaces below; namespaced Roles, no cluster-wide rights.
  mode: all
  # -- list mode only: source namespaces (must exist).
  namespaces: []
  # -- Extra namespaces where probes must never run. kube-system, kube-public,
  # kube-node-lease and default are always excluded. The NetCheck namespace is
  # hidden too and only offered to users with "Allow tests in the NetCheck
  # namespace" checked.
  exclude: []

# -- Who manages the destination policy: "ui" (default) = these values are only
# the INITIAL policy, copied to the database on the first start; afterwards
# administrators edit it in Administration > Destination policy and changes
# apply at once (later changes here are ignored). "helm" = these values are
# authoritative on every start and the web page is read-only.
destinationsManagedBy: ui

# -- Destinations users may test. Default: ANY hostname, IP and port (decision
# of the maintainers, see docs/security.md). To restrict, replace the lists, e.g.
# allowCidrs: [10.0.0.0/16], allowHostnameSuffixes: [.svc.cluster.local],
# allowPorts: [{from: 443, to: 443}].
destinations:
  allowCidrs: ["0.0.0.0/0", "::/0"]
  denyCidrs: []
  allowHostnameSuffixes: ["*"]
  allowPorts:
    - {from: 1, to: 65535}

# -- Who manages the trusted certificate authorities: "ui" (default) = trustedCas
# is only the INITIAL list, copied to the database on the first start;
# afterwards administrators manage it in Administration > Certificate
# authorities. "helm" = trustedCas is authoritative and the web page is read-only.
trustedCasManagedBy: ui

# -- Certificate authorities (PEM) HTTPS checks trust on top of the public ones:
# your corporate PKI or the CA of a proxy that inspects TLS. Public data, safe
# in Git. Each entry may be a bundle; private keys are refused. Example:
# trustedCas:
#   - |
#     -----BEGIN CERTIFICATE-----
#     ...
#     -----END CERTIFICATE-----
trustedCas: []

# -- Who manages the administrators' proxies: "ui" (default) = proxies is only
# the INITIAL list, copied to the database on the first start; afterwards
# administrators manage it in Administration > Proxies. "helm" = proxies is
# authoritative and that page is read-only. Users' personal proxies (My
# proxies) are always managed in the web.
proxiesManagedBy: ui

# -- Administrators' HTTP proxies for TCP, HTTP and HTTPS checks, always optional
# per check. shared (default true): every user may choose it; false: only
# administrators. trustedCas: PEM authorities trusted only for HTTPS checks
# through that proxy (e.g. a proxy that inspects TLS). Each proxy must be a
# destination the policy allows. Authentication is not supported. Example:
# proxies:
#   - name: corp
#     host: proxy.example.com
#     port: 3128
#     shared: true
#     trustedCas: []
proxies: []

# -- Keep true. Always denies cloud metadata (169.254.169.254, fd00:ec2::254,
# where a Pod could read the node IAM credentials), the Kubernetes API server,
# loopback, link-local, multicast and reserved ranges, whatever destinations
# allow. false removes these protections (logged as a warning at startup).
protectPlatformDestinations: true

# -- Extra API server addresses denied as probe destinations (the in-cluster
# service IP is detected automatically; networkPolicy.apiServer.cidrs are added).
kubeApiServerCidrs: []

limits:
  maxChecksPerRun: 7
  defaultCheckTimeoutSeconds: 5
  maxCheckTimeoutSeconds: 10
  maxJobSeconds: 90
  maxOutputBytes: 65536
  maxConcurrentPerNamespace: 3
  maxConcurrentGlobal: 10

probe:
  serviceAccountName: netcheck-probe
  runAsUser: 65532
  cpuRequest: 50m
  cpuLimit: 200m
  memoryRequest: 32Mi
  memoryLimit: 64Mi
  ephemeralStorageLimit: 16Mi
  ttlSecondsAfterFinished: 300
  # -- Delay before checks so VPC CNI programs policies for the new Pod
  # (VPC CNI standard enforcing mode). Measure and adjust.
  settleSeconds: 3
  # -- Probes must run on EC2 Linux nodes: VPC CNI network policies are not
  # enforced on Fargate or Windows.
  nodeSelector:
    kubernetes.io/os: linux

retention:
  outputDays: 15
  metadataDays: 45

# -- Read NetworkPolicies of source namespaces to compute the fidelity badge.
networkPolicyRead: true

persistence:
  size: 2Gi
  # -- Use an existing StorageClass. Leave empty to use the one created below.
  storageClassName: ""
  # -- Existing PVC to reuse (e.g. restored from a snapshot).
  existingClaim: ""
  # -- Disable WAL only on storage without shared-memory locking (never NFS/EFS).
  wal: true
  createStorageClass:
    # -- Create a dedicated encrypted gp3 StorageClass (requires the EBS CSI driver).
    enabled: true
    name: netcheck-gp3
    type: gp3
    encrypted: true
    # -- Optional KMS key ARN for EBS encryption (default: aws/ebs key).
    kmsKeyId: ""
    # -- Retain keeps the EBS volume (and history) if the PVC is deleted.
    reclaimPolicy: Retain
    # -- Availability Zones where the EBS volume may be created, e.g.
    # [eu-west-1a]. Empty = the AZ of the node where the Pod first starts.
    # An EBS volume never moves between AZs: once created, the scheduler always
    # places the Pod in the volume's AZ, so keep node capacity there.
    zones: []

service:
  port: 8080

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}

nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}

# Exposure: enable ONE of httpRoute (NGINX Gateway Fabric) or ingress (AWS Load
# Balancer Controller / ALB). The chart refuses both at the same time. With
# neither, NetCheck is only reachable with kubectl port-forward.
httpRoute:
  # -- Expose NetCheck through an existing Gateway (e.g. NGINX Gateway Fabric).
  # Set to false when using ingress.
  enabled: true
  # -- REQUIRED when enabled, e.g. [netcheck.example.com].
  hostnames: []
  # -- REQUIRED when enabled. sectionName must be the HTTPS listener.
  # - name: shared-gateway
  #   namespace: nginx-gateway
  #   sectionName: https
  parentRefs: []
  annotations: {}

ingress:
  # -- Expose NetCheck with an Ingress instead of a Gateway API route.
  # Requires httpRoute.enabled=false.
  enabled: false
  # -- alb: AWS Load Balancer Controller (one ALB, TLS with ACM, settings in
  # ingress.alb). generic: any Ingress controller (ingress-nginx, Traefik,
  # HAProxy, the AKS application routing add-on...), TLS from a Secret.
  provider: alb
  # -- IngressClass: alb for the AWS Load Balancer Controller, or the class of
  # your controller (e.g. nginx, traefik, webapprouting.kubernetes.azure.com).
  className: alb
  # -- REQUIRED when enabled, e.g. [netcheck.example.com].
  hosts: []
  generic:
    # -- REQUIRED with provider generic: TLS Secret for ingress.hosts in the
    # NetCheck namespace (yours, or the one cert-manager creates when you add
    # its annotation to ingress.annotations). HTTPS is mandatory: passwords
    # travel through the Ingress.
    tlsSecretName: ""
  alb:
    # -- internal (recommended: reachable only from the VPC/VPN) or internet-facing.
    scheme: internal
    # -- REQUIRED when enabled: ACM certificate ARN(s) covering ingress.hosts.
    # HTTPS is mandatory: passwords travel through the ALB.
    certificateArns: []
    sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # -- Add an HTTP:80 listener that only redirects to HTTPS:443.
    sslRedirect: true
    # -- Optional: share an ALB with other Ingresses of the same IngressGroup.
    groupName: ""
    # -- Optional: subnet IDs or names (default: auto-discovery by the
    # kubernetes.io/role/internal-elb or kubernetes.io/role/elb subnet tags).
    subnets: []
    # -- Optional: security groups for the ALB (default: created by the controller).
    securityGroups: []
    # -- Optional: client CIDRs allowed to reach the ALB (default: 0.0.0.0/0).
    inboundCidrs: []
    # -- Optional: AWS WAFv2 web ACL ARN.
    wafv2AclArn: ""
    # -- Optional: tags for the ALB, e.g. {team: platform}.
    tags: {}
  # -- Extra Ingress annotations (override the generated ones).
  annotations: {}

# Dex (https://dexidp.io), bundled like in Argo CD: it signs people in with
# GitHub, GitLab, LDAP, SAML... and hands NetCheck a standard OIDC identity with
# their groups (for GitHub, "org:team"). Requires auth.oidc.enabled and a host
# in ingress.hosts or httpRoute.hostnames: Dex is served at https://<host>/dex.
dex:
  enabled: false
  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.46.0
    digest: "sha256:933fcd3f523338c847b88ef84a7145fb2fcb7b9917f08418612afeaaa2001777"
  # -- Dex connectors. Secret values as $VARIABLE, taken from envSecret.
  # GitHub example (OAuth App callback: https://<host>/dex/callback):
  #   - type: github
  #     id: github
  #     name: GitHub
  #     config:
  #       clientID: $GITHUB_CLIENT_ID
  #       clientSecret: $GITHUB_CLIENT_SECRET
  #       redirectURI: https://netcheck.example.com/dex/callback
  #       orgs:
  #         - name: my-org        # only members of my-org can sign in
  #       teamNameField: slug     # groups like "my-org:my-team"
  connectors: []
  # -- Existing Secret whose keys become environment variables of Dex
  # (e.g. GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET).
  envSecret: ""
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

networkPolicy:
  # -- Disabled by default: the chart creates NO NetworkPolicy in the NetCheck
  # namespace. Enable it only if that namespace uses default-deny policies and
  # you want the chart to manage NetCheck's own ingress/egress rules.
  enabled: false
  # -- Namespaces of the Gateway data plane Pods allowed to reach NetCheck.
  # Empty = the namespaces of httpRoute.parentRefs (NGINX Gateway Fabric 2.x
  # runs the data plane next to its Gateway).
  gatewayNamespaces: []
  # -- Optional Pod labels to narrow ingress to the data plane Pods.
  gatewayPodLabels: {}
  # -- With ingress.enabled: CIDRs of the subnets where the ALB lives (the ALB
  # reaches the Pod IPs directly, target-type ip).
  loadBalancerCidrs: []
  # -- With ingress.provider generic: namespaces of the Ingress controller Pods
  # allowed to reach NetCheck (e.g. [ingress-nginx] or [traefik]).
  ingressNamespaces: []
  # -- Node CIDRs for kubelet health probes, if your CNI enforces host traffic.
  kubeletCidrs: []
  apiServer:
    # -- REQUIRED when enabled: CIDRs that contain the API server endpoint (on EKS,
    # the subnets of the cluster VPC configuration).
    cidrs: []
    ports: [443]
  dns:
    namespace: kube-system
    podLabels: {k8s-app: kube-dns}

admissionPolicy:
  # -- Native ValidatingAdmissionPolicies restricting the Jobs and
  # ServiceAccounts the controller may create. Do not disable it.
  enabled: true

preflight:
  # -- Verify cluster prerequisites during helm install/upgrade (only when
  # Helm is connected to a cluster; skipped by `helm template`).
  enabled: true
  # -- aws-node must run the network policy agent with --enable-network-policy=true.
  vpcCniNetworkPolicy: true
  # -- The EBS CSI driver must be installed when the chart creates the StorageClass.
  ebsCsiDriver: true
  # -- The Gateway referenced by httpRoute.parentRefs must exist.
  gateway: true
  # -- With ingress.enabled, ingress.className must exist (and, with provider
  # alb, belong to the AWS Load Balancer Controller).
  ingressClass: true
