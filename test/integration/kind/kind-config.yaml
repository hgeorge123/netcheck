# kind cluster WITHOUT the default CNI (kindnet does not enforce
# NetworkPolicy). Calico is installed by lab.sh and enforces it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: netcheck-lab
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16 # Calico manifest default pool
  serviceSubnet: 10.96.0.0/12
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
  - role: worker
